# Rotation is set here rather than left to the daemon default so a long-running service cannot fill the
# disk with logs. The brief asks that an operation leave nothing behind that grows forever.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  archive-api:
    image: nemetschek-archive-api
    build:
      context: .
      dockerfile: Nemetschek.Archive/Nemetschek.Archive.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Points at the mount below. Override it to run the same image with a different cabinet set.
      Archive__CabinetsFile: /app/fixtures/cabinets.json
      # Points at the named volume below, which is what makes documents outlive the container.
      Archive__StoragePath: /var/lib/archive
      # The knobs the brief requires to be configurable, so the same image runs with different
      # settings. Defaults are in .env, which holds non-secret values only.
      # The review demo runs with ARCHIVE_MAX_PAGE_SIZE=5.
      Archive__MaxPageSize: ${ARCHIVE_MAX_PAGE_SIZE:-50}
      Archive__MaxUploadBytes: ${ARCHIVE_MAX_UPLOAD_BYTES:-268435456}
      Archive__MaxUploadEntries: ${ARCHIVE_MAX_UPLOAD_ENTRIES:-10000}
    volumes:
      # Read-only: the Archive never writes its cabinet definitions, and the brief fixes them.
      - ./fixtures:/app/fixtures:ro
      # A named volume, not a path in the container: `docker compose down` destroys containers but
      # keeps named volumes, so documents are still here after the next `up`. Only `down -v` would
      # remove them.
      - archive-data:/var/lib/archive
    ports:
      - "${ARCHIVE_PORT:-8080}:8080"
    restart: unless-stopped
    # Long enough for an in-flight upload to be abandoned cleanly on `down`. Anything it had
    # staged is swept at the next start, so a hard kill would not corrupt the store either.
    stop_grace_period: 15s
    # Everything a user uploads is untrusted and the process has no reason to gain privileges.
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      # Readiness, not liveness: this is what a dependent service should wait on.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  # Survives `docker compose down`. Delete it deliberately with `docker compose down -v`.
  archive-data:
