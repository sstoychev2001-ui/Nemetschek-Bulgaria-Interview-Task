name: nemetschek-archive

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  archive-api:
    image: nemetschek-archive-api
    build:
      context: .
      dockerfile: Nemetschek.Archive/Nemetschek.Archive.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Archive__CabinetsFile: /app/fixtures/cabinets.json
      Archive__StoragePath: /var/lib/archive
      Archive__MaxPageSize: 50
      Archive__MaxUploadBytes: 268435456
      Archive__MaxUploadEntries: 10000
      Archive__AllowedOrigins: ""
    volumes:
      - ./fixtures:/app/fixtures:ro
      - archive-data:/var/lib/archive
    ports:
      - "8080:8080"
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  export-api:
    image: nemetschek-export-api
    build:
      context: .
      dockerfile: Nemetschek.Export/Nemetschek.Export.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Export__ArchiveBaseAddress: http://archive-api:8080
      Export__AllowedOrigins: ""
    ports:
      - "8081:8080"
    depends_on:
      - archive-api
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  archive-data:
